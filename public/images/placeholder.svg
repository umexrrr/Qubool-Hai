<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="pinkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8FA" />
      <stop offset="50%" stop-color="#FDF1F5" />
      <stop offset="100%" stop-color="#FBE6EE" />
    </linearGradient>
    <radialGradient id="softGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#pinkBg)" />
  <circle cx="400" cy="420" r="300" fill="url(#softGlow)" />

  <!-- Delicate Border Frame -->
  <rect x="30" y="30" width="740" height="940" fill="none" stroke="#E8BDC8" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.6" rx="8" />
  <rect x="42" y="42" width="716" height="916" fill="none" stroke="#D89AA8" stroke-width="0.8" opacity="0.4" rx="4" />

  <!-- Botanical Line Art Floral Motif -->
  <g transform="translate(400, 320)" stroke="#C78293" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Center Rose / Lotus -->
    <path d="M0 -30 C15 -18, 25 0, 0 25 C-25 0, -15 -18, 0 -30 Z" fill="#FDF1F5" />
    <path d="M-5 -20 C-22 -8, -25 15, 0 35 C25 15, 22 -8, 5 -20" />
    <path d="M-15 -5 C-35 8, -28 32, -3 45" />
    <path d="M15 -5 C35 8, 28 32, 3 45" />
    <!-- Delicate Vine Leaves -->
    <path d="M0 35 C0 75, -20 100, -45 115 M-18 68 C-35 60, -42 45, -30 35 C-22 45, -15 58, -18 68" />
    <path d="M0 35 C0 75, 20 100, 45 115 M18 68 C35 60, 42 45, 30 35 C22 45, 15 58, 18 68" />
    <circle cx="0" cy="-35" r="2.5" fill="#C78293" />
    <circle cx="-35" cy="110" r="2" fill="#C78293" />
    <circle cx="35" cy="110" r="2" fill="#C78293" />
  </g>

  <!-- Camera / Frame Icon -->
  <g transform="translate(400, 470)" stroke="#B86F82" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-24" y="-16" width="48" height="34" rx="5" />
    <path d="M-8 -16 L-5 -22 L5 -22 L8 -16 Z" />
    <circle cx="0" cy="1" r="9" />
    <circle cx="14" cy="-8" r="1.5" fill="#B86F82" />
  </g>

  <!-- Typography -->
  <text x="400" y="550" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-size="24" font-weight="600" letter-spacing="4" fill="#5A3A42" text-anchor="middle">
    QUBOOL HAI IMAGE
  </text>
  <line x1="330" y1="568" x2="470" y2="568" stroke="#D89AA8" stroke-width="1" opacity="0.6" />
  <text x="400" y="596" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="12" font-weight="500" letter-spacing="2.5" fill="#8E636E" text-anchor="middle">
    REPLACE WITH PROJECT PHOTOGRAPH
  </text>

  <text x="400" y="630" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="10.5" font-style="italic" fill="#A8828C" text-anchor="middle">
    Recommended Ratio: 4:5 • Organized in /public/images/
  </text>
</svg>
