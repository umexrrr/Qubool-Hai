<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="100%" height="100%">
  <defs>
    <linearGradient id="founderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9FB" />
      <stop offset="50%" stop-color="#FCEDF2" />
      <stop offset="100%" stop-color="#F9E2EB" />
    </linearGradient>
    <radialGradient id="founderGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1000" height="1250" fill="url(#founderBg)" />
  <circle cx="500" cy="500" r="380" fill="url(#founderGlow)" />

  <!-- Double Arch Frame -->
  <path d="M 120 1150 L 120 480 A 380 380 0 0 1 880 480 L 880 1150 Z" fill="none" stroke="#E3B3BF" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
  <path d="M 140 1150 L 140 490 A 360 360 0 0 1 860 490 L 860 1150 Z" fill="none" stroke="#D89AA8" stroke-width="0.8" opacity="0.4" />

  <!-- Minimal Silhouette Avatar Outline -->
  <g transform="translate(500, 480)" fill="none" stroke="#C47D8F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="0" cy="-70" r="60" fill="#FFF5F8" />
    <!-- Shoulders -->
    <path d="M -130 110 C -130 30, -70 -10, 0 -10 C 70 -10, 130 30, 130 110" fill="#FFF5F8" />
    <!-- Lapel / Suit Line -->
    <path d="M -40 110 L -15 35 L 0 55 L 15 35 L 40 110" />
    <!-- Boutonniere / Blossom on lapel -->
    <circle cx="-25" cy="55" r="5" fill="#D89AA8" />
    <path d="M -25 60 L -25 75" stroke-width="1.2" />
  </g>

  <!-- Title & Text -->
  <g text-anchor="middle">
    <text x="500" y="680" font-family="'Cormorant Garamond', serif" font-size="34" font-weight="600" letter-spacing="3" fill="#422C33">
      Azhar Kazi
    </text>
    <text x="500" y="718" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" letter-spacing="4" fill="#8A5A67">
      FOUNDER &amp; EVENT PLANNER
    </text>
    <line x1="420" y1="745" x2="580" y2="745" stroke="#D89AA8" stroke-width="1" opacity="0.7" />
    <text x="500" y="780" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400" letter-spacing="1.5" fill="#996C78">
      Nominated for AAKAR Excellence Awards
    </text>

    <!-- Replacement instructions badge -->
    <rect x="290" y="860" width="420" height="50" rx="25" fill="#FFFFFF" stroke="#E3B3BF" stroke-width="1" opacity="0.9" />
    <text x="500" y="891" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" letter-spacing="2" fill="#8A5A67">
      REPLACE WITH FOUNDER PORTRAIT
    </text>
    <text x="500" y="935" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-style="italic" fill="#B38A95">
      Organized at: public/images/about/about-founder.jpg (4:5 Ratio)
    </text>
  </g>
</svg>
